<!DOCTYPE html>

<html>
    <head>
        <title>Ace Attorney Cut-In Creator</title>
        <meta charset="UTL-8"/>
        <meta name="author" content="ocarinaofdread"/>
        <meta 
            name="description"
            content="A web tool that allows the user to create Ace Attorney-styled 
                    &quot;cut-ins&quot;, or animations where two characters' faces 
                    fly across the screen."/>
        <link 
            rel="icon" 
            href="favicon.ico" 
            type image="x-icon">
        <!-- Open Graph Data (Embed)-->
        <meta
            property="og:image"
            content="./images/favicon.jpg"/>
        <meta
            property="og:description"
            content="A tool for making Ace Attorney-styled cut-ins."/>
        <meta
            property="og:title"
            content="Ace Attorney Cut-In Creator"/>
        <!-- Scripts -->
        <script type="module" src="selector.js" defer></script>
        <script type="module" src="frameRenderer.js" defer></script>
        <script src="Builds/WebGL/Build/WebGL.loader.js"></script>
        <!-- CSS -->
        <link rel="stylesheet" href="style.css">
                
    </head>
    <!-- Contains ALL PAGE CONTENT -->
    <body>
        <!-- TITLE -->
        <h2 title="Ace Attorney Cut-In Creator">Ace Attorney Cut-In Creator</h1>

        <!-- Style Dropdown -->
        <p>
            <label for="style">Style</label><br/>
            <select name="style" id="style" disabled>
                <option value="empty">------------</option>
                <option value="AAIC">Ace Attorney Investigations Collection</option>
                <!-- <option value="PWDS">Phoenix Wright Trilogy (DS)</option>
                <option value="AJTAJ">Apollo Justice Trilogy (Apollo Justice)</option>
                <option value="AJTDD">Apollo Justice Trilogy (Dual Destinies)</option>
                <option value="AJTSOJ">Apollo Justice Trilogy (Spirit of Justice)</option>
                <option value="TGAAC">The Great Ace Attorney Chronicles</option> -->
            </select>
        </p>

        <!-- Unity Instance -->
        <canvas id="unity-canvas" width=1920 height=1080></canvas>
        <script type="module">
            const canvas = document.querySelector("#unity-canvas");

            const config = {
                dataUrl: "Builds/WebGL/Build/WebGL.data",
                frameworkUrl: "Builds/WebGL/Build/WebGL.framework.js",
                codeUrl: "Builds/WebGL/Build/WebGL.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "ocarinaofdread",
                productName: "Ace Attorney Cut-In Creator",
                productVersion: "1.0",
            };

            window.gameInstance = null;

            createUnityInstance(canvas, config, (progress) => {
                console.log("Loading progress: " + (100 * progress) + "%");
            }).then((unityInstance) => {
                window.gameInstance = unityInstance;
                document.querySelector("#style").disabled = false;
                console.log("Unity instance successfully created!");
            }).catch((message) => {
                alert("Unity instance failed to load: " + message);
            });
        </script>
        <br/>

</html>
